<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{q}} - Bharat Search</title><link rel="stylesheet" href="/static/style.css"></head><body><header><a href="/" class="brand">Bharat</a><form action="/search" class="top"><input name="q" value="{{q}}"><button>Search</button></form></header><main class="results"><p>{{results|length}} results for <b>{{q}}</b></p>{% for r in results %}<article><a class="title" href="{{r.url}}" target="_blank" rel="noopener">{{r.title}}</a><div class="url">{{r.url}}</div><p>{{r.description}}</p></article>{% else %}<h2>No results found</h2>{% endfor %}</main></body></html>
